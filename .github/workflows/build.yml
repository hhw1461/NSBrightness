name: Build Switch .nro

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify / install libnx and switch-tools
        shell: bash
        run: |
          echo "DEVKITPRO=$DEVKITPRO"
          if [ ! -f "$DEVKITPRO/libnx/switch_rules" ]; then
            dkp-pacman -Syu --noconfirm
            dkp-pacman -S --noconfirm switch-libnx switch-tools
          fi
          test -f "$DEVKITPRO/libnx/switch_rules"

      - name: Build
        shell: bash
        run: |
          make -j"$(nproc)"
          ls -lh ./*.nro

      - name: Upload .nro
        uses: actions/upload-artifact@v4
        with:
          name: switch-brightness-nro
          path: ./*.nro
          if-no-files-found: error
